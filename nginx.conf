events {}

http {
    # `proxy_` headers below must match TRUSTED_PROXIES in config.py; if the
    # count there is 0, the app will not trust X-Forwarded-Proto and will emit
    # http:// links behind this terminator.
    upstream jobhunter_web {
        server web:8000;
        keepalive 16;
    }

    # Housekeeping shared by every server block.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    gzip on;
    gzip_types text/plain text/css application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;

        # Must be >= MAX_CONTENT_LENGTH in config.py (2 MB). Left at the nginx
        # default of 1 MB, a large upload would be rejected by nginx with an
        # unbranded error instead of the app's own 413 page.
        client_max_body_size 2m;

        # Fingerprinted? No — the CSS and icon sprite are stable filenames, so
        # revalidate instead. Long TTL would strand clients on a stale bundle.
        location /static/ {
            proxy_pass http://jobhunter_web;
            proxy_set_header Host $host;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        location = /healthz {
            proxy_pass http://jobhunter_web;
            proxy_set_header Host $host;
            access_log off;
        }

        location / {
            proxy_pass http://jobhunter_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 60s;
        }
    }
}
