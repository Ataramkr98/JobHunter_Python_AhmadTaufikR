# Production-shaped stack: web (Gunicorn), Celery worker + beat, PostgreSQL,
# Redis and Nginx. The web app reads DATABASE_URL / REDIS_URL from the env.
#
#   SECRET_KEY=... docker compose up --build
#
# SECRET_KEY is required — the app refuses to boot production without one. See
# .env.example. Set SESSION_COOKIE_SECURE=0 only when serving plain HTTP locally
# (this stack terminates no TLS, so secure cookies need that override).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    # No `command:` override on purpose — the image's entrypoint creates the
    # schema once before Gunicorn forks, which overriding here would skip.
    environment:
      FLASK_CONFIG: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — see .env.example}
      DATABASE_URL: postgresql://jobhunter:jobhunter@postgres:5432/jobhunter
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXIES: 1
      # This stack serves plain HTTP on :80; secure cookies need HTTPS.
      SESSION_COOKIE_SECURE: 0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8000:8000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A worker.celery_app worker --loglevel=info
    environment:
      FLASK_CONFIG: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — see .env.example}
      DATABASE_URL: postgresql://jobhunter:jobhunter@postgres:5432/jobhunter
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A worker.celery_app beat --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [web]

volumes:
  pgdata:
